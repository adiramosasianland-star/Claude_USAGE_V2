<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude · Accounts</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen">
        <div class="login-box">
            <div class="login-mark"></div>
            <h1>Account Tracker</h1>
            <p class="login-subtitle">Sign in to continue</p>
            <div id="loginForm" class="form-group">
                <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
                <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
                <div id="loginError" class="login-error"></div>
                <button id="loginBtn" class="btn btn-primary" onclick="login()">Sign in</button>
            </div>
        </div>
    </div>

    <!-- App Screen -->
    <div id="appScreen">

        <nav class="navbar">
            <a class="navbar-brand" href="index.html">
                <div class="navbar-dot"></div>
                claude / accounts
            </a>
            <div class="navbar-actions">
                <a id="usersNavLink" href="users.html" class="navbar-link" style="display:none;">
                    <i data-lucide="users" style="width:13px;height:13px;"></i>
                    Users
                </a>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                    <i data-lucide="sun" id="themeIconLight"></i>
                    <i data-lucide="moon" id="themeIconDark" style="display:none;"></i>
                </button>
                <button class="btn btn-ghost btn-sm" onclick="logout()">Sign out</button>
            </div>
        </nav>

        <main class="main">
            <div class="page-header">
                <div>
                    <div class="page-title">Accounts</div>
                    <div class="page-subtitle" id="accountCount">—</div>
                </div>
                <button class="btn btn-primary" onclick="showAddModal()">
                    <i data-lucide="plus"></i>
                    Add account
                </button>
            </div>

            <div class="accounts-grid" id="accountsGrid">
                <div class="loading">loading accounts...</div>
            </div>
        </main>
    </div>

    <!-- Add Account Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Add account</span>
                <button class="modal-close" onclick="closeAddModal()">&#x2715;</button>
            </div>
            <div class="form-group">
                <label>Email address</label>
                <input type="email" id="newEmail" placeholder="you@example.com">
                <button class="btn btn-primary" onclick="addAccount()">
                    <i data-lucide="plus"></i>
                    Add account
                </button>
            </div>
        </div>
    </div>

    <!-- Set Cooldown Modal -->
    <div id="cooldownModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Set cooldown</span>
                <button class="modal-close" onclick="closeCooldownModal()">&#x2715;</button>
            </div>
            <div class="form-group">
                <label>Available from date</label>
                <input type="date" id="cooldownDate">
                <label>Select hour</label>
                <div class="time-grid">
                    <button type="button" class="time-btn" data-hour="0">12 AM</button>
                    <button type="button" class="time-btn" data-hour="1">1 AM</button>
                    <button type="button" class="time-btn" data-hour="2">2 AM</button>
                    <button type="button" class="time-btn" data-hour="3">3 AM</button>
                    <button type="button" class="time-btn" data-hour="4">4 AM</button>
                    <button type="button" class="time-btn" data-hour="5">5 AM</button>
                    <button type="button" class="time-btn" data-hour="6">6 AM</button>
                    <button type="button" class="time-btn" data-hour="7">7 AM</button>
                    <button type="button" class="time-btn" data-hour="8">8 AM</button>
                    <button type="button" class="time-btn" data-hour="9">9 AM</button>
                    <button type="button" class="time-btn" data-hour="10">10 AM</button>
                    <button type="button" class="time-btn" data-hour="11">11 AM</button>
                    <button type="button" class="time-btn" data-hour="12">12 PM</button>
                    <button type="button" class="time-btn" data-hour="13">1 PM</button>
                    <button type="button" class="time-btn" data-hour="14">2 PM</button>
                    <button type="button" class="time-btn" data-hour="15">3 PM</button>
                    <button type="button" class="time-btn" data-hour="16">4 PM</button>
                    <button type="button" class="time-btn" data-hour="17">5 PM</button>
                    <button type="button" class="time-btn" data-hour="18">6 PM</button>
                    <button type="button" class="time-btn" data-hour="19">7 PM</button>
                    <button type="button" class="time-btn" data-hour="20">8 PM</button>
                    <button type="button" class="time-btn" data-hour="21">9 PM</button>
                    <button type="button" class="time-btn" data-hour="22">10 PM</button>
                    <button type="button" class="time-btn" data-hour="23">11 PM</button>
                </div>
                <input type="hidden" id="cooldownHour">
                <input type="hidden" id="cooldownId">
                <button class="btn btn-primary" onclick="setCooldown()">
                    <i data-lucide="clock"></i>
                    Set cooldown
                </button>
            </div>
        </div>
    </div>

    <!-- Delete Modal -->
    <div id="deleteModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <span class="modal-title">Delete account</span>
            </div>
            <p class="modal-desc">This will permanently remove the account. This action cannot be undone.</p>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
                <button class="btn btn-danger" onclick="confirmDelete()">
                    <i data-lucide="trash-2"></i>
                    Delete
                </button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="app.js"></script>
</body>
</html>
