<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude · Users</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

    <!-- Login Screen (redirect only — no login form here) -->
    <div id="loginScreen" style="display:none;"></div>

    <!-- App Screen -->
    <div id="appScreen">

        <nav class="navbar">
            <a class="navbar-brand" href="index.html">
                <div class="navbar-dot"></div>
                claude / users
            </a>
            <div class="navbar-actions">
                <a href="index.html" class="navbar-link">
                    <i data-lucide="layout-grid" style="width:13px;height:13px;"></i>
                    Accounts
                </a>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
                    <i data-lucide="sun" id="themeIconLight"></i>
                    <i data-lucide="moon" id="themeIconDark" style="display:none;"></i>
                </button>
                <button class="btn btn-ghost btn-sm" onclick="logout()">Sign out</button>
            </div>
        </nav>

        <main class="main">
            <div class="page-header">
                <div>
                    <div class="page-title">Users</div>
                    <div class="page-subtitle" id="userCount">—</div>
                </div>
                <button class="btn btn-primary" onclick="showInviteModal()">
                    <i data-lucide="user-plus"></i>
                    Invite user
                </button>
            </div>

            <div id="usersTableWrap" class="users-table-wrap">
                <div class="loading">loading users...</div>
            </div>
        </main>
    </div>

    <!-- Invite Modal -->
    <div id="inviteModal" class="modal">
        <div class="modal-content modal-small">
            <div class="modal-header">
                <span class="modal-title">Invite user</span>
                <button class="modal-close" onclick="closeInviteModal()">&#x2715;</button>
            </div>
            <div class="form-group">
                <label>Email address</label>
                <input type="email" id="inviteEmail" placeholder="you@example.com">
                <p class="modal-desc" style="margin-bottom:0;">An invite link will be sent to this address.</p>
                <button class="btn btn-primary" onclick="inviteUser()">
                    <i data-lucide="send"></i>
                    Send invite
                </button>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Edit user</span>
                <button class="modal-close" onclick="closeEditModal()">&#x2715;</button>
            </div>
            <div class="form-group">
                <input type="hidden" id="editUserId">

                <label>Email address</label>
                <input type="email" id="editEmail" placeholder="you@example.com">

                <div class="divider"></div>

                <div class="toggle-row">
                    <div class="toggle-label">
                        <span>Admin</span>
                        <small>Can manage users and all accounts</small>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="editIsAdmin">
                        <span class="toggle-track"></span>
                    </label>
                </div>

                <div class="toggle-row">
                    <div class="toggle-label">
                        <span>Active</span>
                        <small>Inactive users cannot sign in</small>
                    </div>
                    <label class="toggle">
                        <input type="checkbox" id="editIsActive">
                        <span class="toggle-track"></span>
                    </label>
                </div>

                <div class="modal-actions" style="margin-top:8px;">
                    <button class="btn btn-ghost" onclick="closeEditModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveUser()">
                        <i data-lucide="check"></i>
                        Save changes
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>
    <script src="users.js"></script>
</body>
</html>
